[workspace]
members = [
    "common",
    "drivers/postgres",
    "drivers/mssql",
    "drivers/mysql",
    "drivers/oracle",
    "drivers/databricks",
    "transports/cloud",
    "transports/sftp",
    "transports/ftp",
    "transports/sharepoint",
    "transports/smb",
    "runtime",
    "cli",
    "python",
]
resolver = "2"

# Shared dependency versions — all workspace members inherit these.
[workspace.dependencies]
arrow            = { version = "58", features = ["prettyprint", "csv"] }
tokio            = { version = "1", features = ["full"] }
futures          = "0.3"
async-stream     = "0.3"
async-trait      = "0.1"
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
serde_yaml_ng    = "0.10"
anyhow           = "1"
chrono           = "0.4"
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
indexmap          = { version = "2", features = ["serde"] }
reqwest           = { version = "0.13", default-features = false, features = ["json", "rustls", "query", "form"] }
bytes             = "1"
base64            = "0.22"
uuid              = { version = "1", features = ["v4"] }
dashmap           = "6"
jsonwebtoken      = { version = "10", features = ["use_pem", "rust_crypto"] }

# File I/O dependencies
parquet           = { version = "58", features = ["snap", "lz4", "zstd", "flate2"] }

# Transport-specific dependencies (each lives in its own crate)
object_store      = { version = "0.13", features = ["aws", "azure", "gcp"] }
russh             = "0.61"
russh-sftp        = "2"
suppaftp          = { version = "8", features = ["native-tls"] }
pavao             = "0.2"
url               = "2"

# Test dependencies
testcontainers         = "0.27"
testcontainers-modules = { version = "0.15", features = ["minio"] }

# Common crate (shared by all drivers, transports, and runtime)
potato-etl-common = { path = "common" }

# Database driver crates
potato-etl-driver-postgres   = { path = "drivers/postgres" }
potato-etl-driver-mssql      = { path = "drivers/mssql" }
potato-etl-driver-mysql      = { path = "drivers/mysql" }
potato-etl-driver-oracle     = { path = "drivers/oracle" }
potato-etl-driver-databricks = { path = "drivers/databricks" }

# File transport crates
potato-etl-transport-cloud       = { path = "transports/cloud" }
potato-etl-transport-sftp        = { path = "transports/sftp" }
potato-etl-transport-ftp         = { path = "transports/ftp" }
potato-etl-transport-sharepoint  = { path = "transports/sharepoint" }
potato-etl-transport-smb         = { path = "transports/smb" }