[package]
name    = "potato-etl-driver-mysql"
version = "0.1.0"
edition = "2024"

# MySQL / Aurora / MariaDB driver — pure Rust via sqlx.

[dependencies]
potato-etl-common = { workspace = true }
arrow        = { workspace = true }
tokio        = { workspace = true }
futures      = { workspace = true }
async-stream = { workspace = true }
anyhow       = { workspace = true }
chrono       = { workspace = true }
tracing      = { workspace = true }
serde        = { workspace = true }
uuid         = { workspace = true }

sqlx = { version = "0.8", features = ["runtime-tokio", "mysql", "chrono", "tls-rustls"] }